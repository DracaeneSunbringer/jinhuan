<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>账号密码 · 尽欢</title>
<style>
:root { --bg: #f5f6f8; --card: #fff; --ink: #1f2328; --muted: #6b7280; --line: #e5e7eb; --brand: #16a34a; --brand2: #15803d; --err: #b42318; }
@media (prefers-color-scheme: dark) { :root { --bg: #111418; --card: #1a1e24; --ink: #e8eaed; --muted: #9aa3ae; --line: #2b313a; --err: #ff8a80; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink); font: 15px/1.6 system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
main { width: min(400px, calc(100% - 32px)); margin: 24px 0; padding: 28px 24px; border-radius: 16px; background: var(--card); box-shadow: 0 6px 30px rgba(0,0,0,.08); }
h1 { margin: 0 0 4px; font-size: 21px; }
p.sub { margin: 0 0 18px; color: var(--muted); font-size: 14px; }
label { display: grid; gap: 4px; margin: 0 0 12px; font-weight: 600; font-size: 14px; }
label small { font-weight: 400; color: var(--muted); }
input { font: inherit; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: transparent; color: inherit; }
input:focus { outline: 2px solid color-mix(in srgb, var(--brand) 40%, transparent); border-color: var(--brand); }
button { width: 100%; margin-top: 4px; padding: 11px; border: 0; border-radius: 10px; background: var(--brand); color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
button:hover { background: var(--brand2); } button:disabled { opacity: .6; cursor: wait; }
.msg { min-height: 22px; margin: 10px 0 0; font-size: 14px; }
.msg.err { color: var(--err); } .msg.ok { color: var(--brand); }
nav { display: flex; flex-wrap: wrap; gap: 6px 14px; justify-content: center; margin-top: 18px; font-size: 14px; }
a { color: var(--brand); text-decoration: none; } a:hover { text-decoration: underline; }
.badge { display: inline-block; padding: 2px 8px; border-radius: 999px; background: color-mix(in srgb, var(--brand) 14%, transparent); color: var(--brand); font-size: 13px; font-weight: 700; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <section id="loading"><p class="sub">正在读取…</p></section>

  <!-- 未登录：账号密码登录 -->
  <section id="login" hidden>
    <h1>账号密码登录</h1>
    <p class="sub">用你在「账号安全」里设置过的登录名和密码登录，和用 Linux.DO / Google / GitHub 登录是同一个号。</p>
    <form id="login-form" autocomplete="on">
      <label>登录名<input name="login" autocomplete="username" required maxlength="24" autocapitalize="off" spellcheck="false"></label>
      <label>密码<input name="password" type="password" autocomplete="current-password" required minlength="8" maxlength="128"></label>
      <button type="submit">登录</button>
      <p class="msg" role="status" aria-live="polite"></p>
    </form>
    <nav><a id="other-login" href="/login">用其他方式登录</a><a href="/">逛图廊</a></nav>
  </section>

  <!-- 已登录：设置 / 修改账号密码 -->
  <section id="set" hidden>
    <h1 id="set-title">设置账号密码</h1>
    <p class="sub" id="set-sub">设置后可以直接用「登录名 + 密码」登录这个账号，不用再依赖 Linux.DO。</p>
    <form id="set-form" autocomplete="on">
      <label>登录名 <small>3～24 位字母、数字、下划线，不区分大小写；只用来登录，别人看不到</small><input name="login" autocomplete="username" required maxlength="24" autocapitalize="off" spellcheck="false"></label>
      <label id="current-row" hidden>当前密码 <small>已经设过密码（或用过邮箱密码），改之前要先验证</small><input name="current" type="password" autocomplete="current-password" maxlength="128"></label>
      <label>新密码 <small>8～128 位，别和登录名一样</small><input name="password" type="password" autocomplete="new-password" required minlength="8" maxlength="128"></label>
      <label>再输一次<input name="confirm" type="password" autocomplete="new-password" required minlength="8" maxlength="128"></label>
      <button type="submit">保存</button>
      <p class="msg" role="status" aria-live="polite"></p>
    </form>
    <nav><a href="/me/account">返回账号安全</a><a href="/">逛图廊</a></nav>
  </section>

  <section id="unavailable" hidden>
    <h1>账号密码登录还没开放</h1>
    <p class="sub">站长还在配置，过一会儿再来看看。</p>
    <nav><a href="/login">去登录页</a><a href="/">逛图廊</a></nav>
  </section>
</main>
<script>
(async () => {
  const $ = (s) => document.querySelector(s)
  const show = (id) => { for (const s of document.querySelectorAll('main > section')) s.hidden = s.id !== id }
  const next = (() => { const n = new URLSearchParams(location.search).get('next') || '/'; return /^\/(?!\/)/.test(n) ? n : '/' })()
  $('#other-login').href = '/login?next=' + encodeURIComponent(next)
  const api = async (url, opts = {}) => {
    const r = await fetch(url, { credentials: 'same-origin', ...opts, headers: { 'content-type': 'application/json', ...(opts.headers || {}) } })
    const j = await r.json().catch(() => ({}))
    if (!r.ok) throw Object.assign(new Error(j.error || '出错了，请稍后再试'), { status: r.status, code: j.code })
    return j
  }
  const busy = (form, on, text) => { const b = form.querySelector('button'); b.disabled = on; if (text) b.textContent = text }
  const msg = (form, text, ok) => { const m = form.querySelector('.msg'); m.textContent = text || ''; m.className = 'msg ' + (ok ? 'ok' : 'err') }
  let me = null
  try { me = await api('/api/me/login-password') } catch (e) { if (e.status !== 401 && e.status !== 403) { show('login'); msg($('#login-form'), e.message) } }
  if (!me) {
    const cfg = await api('/api/auth/config').catch(() => ({}))
    if (!cfg.password_login) return show('unavailable')
    show('login')
    $('#login-form').addEventListener('submit', async (e) => {
      e.preventDefault(); const f = e.currentTarget; msg(f, ''); busy(f, true, '正在登录…')
      try { const r = await api('/api/auth/password-login', { method: 'POST', body: JSON.stringify({ login: f.login.value, password: f.password.value, next }) }); location.replace(r.next || next) }
      catch (err) { msg(f, err.message); busy(f, false, '登录') }
    })
    return
  }
  if (!me.available) return show('unavailable')
  show('set')
  const f = $('#set-form')
  if (me.login) { $('#set-title').textContent = '修改账号密码'; $('#set-sub').innerHTML = '当前登录名：<span class="badge"></span>　可以改登录名或密码。'; $('#set-sub .badge').textContent = me.login; f.login.value = me.login }
  else f.login.value = /^[A-Za-z0-9_][A-Za-z0-9_.-]{1,22}[A-Za-z0-9_]$/.test(me.username || '') && !/^\d+$/.test(me.username) ? me.username : ''
  if (me.has_password) { $('#current-row').hidden = false; f.current.required = true }
  const reauthUrl = '/login?next=' + encodeURIComponent('/account-password.html' + location.search)
  const askReauth = (text) => {
    const m = f.querySelector('.msg'); m.className = 'msg err'
    m.replaceChildren(text + ' ', Object.assign(document.createElement('a'), { href: reauthUrl, textContent: '重新登录' }))
  }
  if (me.reauth_required) askReauth('为保护账号，首次设置密码前需要重新登录一次（5 分钟内有效）。')
  f.addEventListener('submit', async (e) => {
    e.preventDefault(); msg(f, '')
    if (f.password.value !== f.confirm.value) return msg(f, '两次输入的密码不一样')
    busy(f, true, '正在保存…')
    try {
      const r = await api('/api/me/login-password', { method: 'POST', body: JSON.stringify({ login: f.login.value, password: f.password.value, confirm: f.confirm.value, current: f.current.value || undefined }) })
      try { localStorage.setItem('loginPasswordSet', '1') } catch {}
      msg(f, `已保存。以后可以用登录名「${r.login}」+ 密码登录${r.changed ? '（其他设备已退出）' : ''}。`, true)
      busy(f, false, '保存'); f.password.value = f.confirm.value = f.current.value = ''
      $('#set-title').textContent = '修改账号密码'; $('#current-row').hidden = false; f.current.required = true
    } catch (err) {
      if (err.code === 'reauth_required') askReauth('为保护账号，首次设置密码前需要重新登录一次（5 分钟内有效）。')
      else msg(f, err.message)
      busy(f, false, '保存')
    }
  })
})()
</script>
</body>
</html>
