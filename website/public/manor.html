<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#7fbf6a">
<title>肥鱼庄园 · 尽欢</title>
<link rel="icon" href="/favicon.svg">
<link rel="stylesheet" href="/manor.css?v=1">
</head>
<body>
<div id="app">
  <header class="mh">
    <a class="mh-back" href="/" aria-label="回尽欢首页">‹</a>
    <div class="mh-who"><strong id="mh-title">肥鱼庄园</strong><span class="mh-lv"><b id="mh-lv">Lv1</b><i><em id="mh-xp"></em></i></span></div>
    <div class="mh-stats">
      <span class="pill coin" title="D币"><img alt="" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20'%3E%3Ccircle cx='10' cy='10' r='9' fill='%23f5c242'/%3E%3Ccircle cx='10' cy='10' r='6.5' fill='%23f9d86b'/%3E%3Ctext x='10' y='14' font-size='9' font-weight='bold' text-anchor='middle' fill='%23a8741a'%3ED%3C/text%3E%3C/svg%3E"><span id="mh-coins">—</span></span>
      <span class="pill energy" title="能量（种树用）"><i></i><span id="mh-energy">0g</span></span>
    </div>
  </header>
  <div class="mvisit" id="mvisit" hidden><span id="mvisit-text"></span><button type="button" id="mvisit-home">回家</button></div>
  <div class="stage" id="stage"><canvas id="cv"></canvas></div>
  <nav class="mbar">
    <button type="button" data-open="visit"><span class="ic">🏃</span>串门</button>
    <button type="button" data-open="bag"><span class="ic">🧺</span>仓库</button>
    <button type="button" data-open="shop"><span class="ic">🏪</span>商店</button>
    <button type="button" data-open="logs"><span class="ic">📜</span>动态<b class="badge" id="logs-badge" hidden></b></button>
    <button type="button" data-open="help"><span class="ic">❔</span>玩法</button>
  </nav>
  <div class="sheet-wrap" id="sheet-wrap" hidden><section class="sheet" id="sheet" role="dialog" aria-modal="true"><header><h2 id="sheet-title"></h2><button type="button" class="x" id="sheet-x" aria-label="关闭">×</button></header><div class="sheet-body" id="sheet-body"></div></section></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="loading" id="loading">大肥鱼正在去庄园的路上…</div>
</div>
<script type="module" src="/manor.js?v=1"></script>
</body>
</html>
